[project]
name = "stroke-rehabilitation-testbed"
version = "0.1.0"
description = "Supplementary code for VLM training and multi-agent stroke-rehabilitation assessment."
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate==1.15.0",
    "huggingface-hub==1.33.0",
    "langchain-core==1.6.5",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "lightning==2.6.5",
    "matplotlib==3.11.2",
    "numpy==2.5.2",
    "pandas==3.0.6",
    "peft==0.21.0",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "torch==2.12.0",
    "tqdm==4.70.1",
    "transformers==5.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
