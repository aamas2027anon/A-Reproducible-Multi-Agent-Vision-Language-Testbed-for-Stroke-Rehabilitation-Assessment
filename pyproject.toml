[project]
name = "stroke-rehabilitation-testbed"
version = "0.1.0"
description = "A vision-language and multi-agent testbed for stroke-rehabilitation assessment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "einops>=0.8.2",
    "gradio>=6.31.0",
    "huggingface-hub==1.33.0",
    "langchain-core==1.6.5",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "lightning==2.6.5",
    "matplotlib==3.11.2",
    "ninja>=1.13.2",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "peft==0.20.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "torch==2.13.0",
    "tqdm==4.70.1",
    "transformers==5.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
